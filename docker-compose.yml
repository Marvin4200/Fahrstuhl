name: marvin-phase1

services:
  redis:
    image: redis:7-alpine
    container_name: redis-phase1
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 16m
    networks:
      - marvin_internal
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  statuspage:
    build:
      context: ../statuspage
      dockerfile: Dockerfile
    container_name: statuspage-phase1
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 64m
    env_file:
      - path: ../statuspage/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3012
      FAHRSTUHL_HEALTH_URL: ${FAHRSTUHL_HEALTH_URL:-http://fahrstuhl-docker:3002/health}
      ESELTOKENS_HEALTH_URL: ${ESELTOKENS_HEALTH_URL:-http://eseltokens-docker:3000/eseltokens/api/health}
      ESELMUSIC_HEALTH_URL: ${ESELMUSIC_HEALTH_URL:-http://musikbot-docker:3020/health}
      ESEL_HEALTH_URL: ${ESEL_HEALTH_URL:-http://esel:3015/health}
      LINKSHORTENER_HEALTH_URL: ${LINKSHORTENER_HEALTH_URL:-http://linkshortener:3010/health}
      FILEHOSTER_HEALTH_URL: ${FILEHOSTER_HEALTH_URL:-http://filehoster:3011/health}
      ZITATBOARD_HEALTH_URL: ${ZITATBOARD_HEALTH_URL:-http://zitatboard:3013/health}
      TEAM_HEALTH_URL: ${TEAM_HEALTH_URL:-http://team:3014/health}
      STATUSPAGE_HEALTH_URL: ${STATUSPAGE_HEALTH_URL:-http://statuspage:3012/health}
    ports:
      - "127.0.0.1:3112:3012"
    volumes:
      - statuspage_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  team:
    build:
      context: ../team
      dockerfile: Dockerfile
    container_name: team-phase1
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    depends_on:
      fahrstuhl-docker:
        condition: service_healthy
    env_file:
      - path: ../team/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3014
      FAHRSTUHL_API_URL: ${TEAM_FAHRSTUHL_API_URL:-http://fahrstuhl-docker:3002}
      ADMIN_LOG_URL: http://admin-dashboard:3021
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3114:3014"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3014/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  linkshortener:
    build:
      context: ../linkshortener
      dockerfile: Dockerfile
    container_name: linkshortener-phase1
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 64m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: ../linkshortener/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3010
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:3110:3010"
    volumes:
      - linkshortener_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  esel:
    build:
      context: ../esel
      dockerfile: Dockerfile
    container_name: esel-phase1
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 64m
    environment:
      NODE_ENV: production
      PORT: 3015
      ADMIN_LOG_URL: http://admin-dashboard:3021
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3115:3015"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3015/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    container_name: admin-dashboard-phase1
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 48m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: ../admin-dashboard/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3021
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3121:3021"
    volumes:
      - ../filehoster/stats:/app/stats:ro
      - admin_dashboard_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  filehoster:
    build:
      context: ../filehoster
      dockerfile: Dockerfile
    container_name: filehoster-phase1
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 64m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: ../filehoster/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3011
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:3111:3011"
    volumes:
      - filehoster_data:/app/data
      - filehoster_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  zitatboard:
    build:
      context: ../zitatboard
      dockerfile: Dockerfile
    container_name: zitatboard-phase1
    restart: unless-stopped
    mem_limit: 160m
    mem_reservation: 64m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: ../zitatboard/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3013
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:3113:3013"
    volumes:
      - zitatboard_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3013/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  autodeploy:
    build:
      context: ../webhooks
      dockerfile: Dockerfile
    container_name: autodeploy-phase1
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    env_file:
      - path: ../webhooks/.env
        required: false
    ports:
      - "127.0.0.1:9111:9011"
    networks:
      - marvin_internal

  deploy-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploy-webhook-phase1
    user: root
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 9000
      COMPOSE_FILE: /home/marvin/fahrstuhl/docker-compose.yml
      DEPLOY_SERVICES: fahrstuhl-docker dashboard-php
      DEPLOY_REPO_DIR: /home/marvin
    ports:
      - "127.0.0.1:9100:9000"
    command: ["node", "scripts/deploy-webhook.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/marvin:/home/marvin
    networks:
      - marvin_internal

  deploy-extra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploy-extra-phase1
    user: root
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      EXTRA_DEPLOY_PORT: 9012
      COMPOSE_FILE: /home/marvin/fahrstuhl/docker-compose.yml
    ports:
      - "127.0.0.1:9102:9012"
    command: ["node", "scripts/deploy-extra.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/marvin:/home/marvin
    networks:
      - marvin_internal

  lavalink-docker:
    image: fredboat/lavalink:4
    container_name: lavalink-docker-phase1
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    mem_limit: 900m
    mem_reservation: 256m
    volumes:
      - ../musikbot/application.yml:/opt/Lavalink/application.yml:ro
      - ../musikbot/plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:3233:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:2333/ 2>&1 | grep -q '401 Unauthorized'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - marvin_internal

  musikbot-docker:
    build:
      context: ../musikbot
      dockerfile: Dockerfile
    container_name: musikbot-docker-phase1
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 256m
    depends_on:
      lavalink-docker:
        condition: service_healthy
    env_file:
      - path: ../musikbot/.env
        required: false
    environment:
      NODE_ENV: production
      LAVALINK_HOST: lavalink-docker:2333
      LAVALINK_PORT: "2333"
      NODE_OPTIONS: "--max-old-space-size=384"
    command:
      - sh
      - -c
      - |
        until node -e "const net=require('net'); const raw=process.env.LAVALINK_HOST||'lavalink-docker:2333'; const parts=raw.split(':'); const host=parts[0]; const port=Number(parts[1]||process.env.LAVALINK_PORT||2333); const s=net.createConnection({host,port}); s.on('connect',()=>{s.end(); process.exit(0);}); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),2000);"; do
          echo "[musikbot] waiting for Lavalink ($$LAVALINK_HOST)..."
          sleep 2
        done
        exec node index.js
    volumes:
      - ../musikbot/data:/app/data
    ports:
      - "127.0.0.1:3020:3020"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - marvin_internal


  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup-worker-phase1
    user: root
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      BACKUP_RUN_ON_START: "false"
      BACKUP_INTERVAL_MINUTES: "360"
      MARVIN_HOME: /home/marvin
      BACKUP_ROOT: /home/marvin/backups
    command: ["node", "scripts/backup-worker.js"]
    volumes:
      - /home/marvin/backups:/home/marvin/backups
      - /home/marvin/fahrstuhl:/home/marvin/fahrstuhl:ro
      - /home/marvin/eseltokens:/home/marvin/eseltokens:ro
      - /home/marvin/filehoster:/home/marvin/filehoster:ro
      - /home/marvin/linkshortener:/home/marvin/linkshortener:ro
      - /home/marvin/zitat-board:/home/marvin/zitat-board:ro
      - /home/marvin/statuspage:/home/marvin/statuspage:ro
      - /home/marvin/musikbot:/home/marvin/musikbot:ro
    networks:
      - marvin_internal


  eseltokens-webhook-docker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eseltokens-webhook-phase1
    user: root
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    env_file:
      - path: ./.env
        required: false
      - path: ./.env-dashboard
        required: false
    environment:
      NODE_ENV: production
      PORT: 9001
      COMPOSE_FILE: /home/marvin/fahrstuhl/docker-compose.yml
      ESELTOKENS_SERVICE: eseltokens-docker
      ESELTOKENS_REPO_DIR: /home/marvin/eseltokens
    ports:
      - "127.0.0.1:9101:9001"
    command: ["node", "scripts/eseltokens-webhook.js"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/marvin:/home/marvin
    networks:
      - marvin_internal


  umami-db:
    image: postgres:15-alpine
    container_name: umami-db-phase1
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 64m
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: 06cdc764229df4e4a6a425166fcad8f25b3e8bed23a35784
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami-phase1
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 64m
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:06cdc764229df4e4a6a425166fcad8f25b3e8bed23a35784@umami-db:5432/umami
      APP_SECRET: 0e33aff4b9321186bad72d8736310e13562c812a936adebd1e370b53d1086d14
    ports:
      - "127.0.0.1:3120:3000"
    networks:
      - marvin_internal

  freegamesapi:
    build:
      context: ../freegamesapi
      dockerfile: Dockerfile
    container_name: freegamesapi-phase1
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    environment:
      NODE_ENV: production
      PORT: 3016
      ADMIN_LOG_URL: http://admin-dashboard:3021
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3116:3016"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3016/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - marvin_internal

  fahrstuhl-docker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fahrstuhl-phase1
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    depends_on:
      redis:
        condition: service_healthy
      lavalink-docker:
        condition: service_healthy
      musikbot-docker:
        condition: service_healthy
      freegamesapi:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
      - path: ./.env-dashboard
        required: false
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MYSQL_HOST: host.docker.internal
      NODE_OPTIONS: "--max-old-space-size=384"
      # Override 127.0.0.1 defaults — use container names inside Docker network
      ESELTOKENS_VOICE_REWARD_URL: http://eseltokens-docker:3000/eseltokens/api/integrations/fahrstuhl/voice-reward/
      LAVALINK_HOST: lavalink-docker:2333
      DASHBOARD_PHP_HEALTH_URL: http://dashboard-php:8081/health
      DASHBOARD_HEALTH_URL: http://dashboard-php:8081/
      DEPLOY_WEBHOOK_HEALTH_URL: http://deploy-webhook:9000/health
      ESELTOKENS_HEALTH_URL: http://eseltokens-docker:3000/eseltokens/api/health
      ESELTOKENS_WEBHOOK_HEALTH_URL: http://eseltokens-webhook-docker:9001/health
      ESEL_HEALTH_URL: http://esel:3015/health
      ESELMUSIC_HEALTH_URL: http://musikbot-docker:3020/health
      FILEHOSTER_HEALTH_URL: http://filehoster:3011/health
      LINKSHORTENER_HEALTH_URL: http://linkshortener:3010/health
      STATUSPAGE_HEALTH_URL: http://statuspage:3012/health
      TEAM_HEALTH_URL: http://team:3014/health
      ZITATBOARD_HEALTH_URL: http://zitatboard:3013/health
      FREE_GAMES_API_URL: http://freegamesapi:3016
    ports:
      - "127.0.0.1:3102:3002"
    command: ["node", "index.js"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./globalStats.json:/app/globalStats.json
      - ./userPrefs.json:/app/userPrefs.json
      - /home/marvin/backups:/home/marvin/backups:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marvin_internal


  eseltokens-docker:
    build:
      context: ../eseltokens
      dockerfile: Dockerfile
    container_name: eseltokens-phase1
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 160m
    env_file:
      - path: ../eseltokens/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=256"
      ADMIN_LOG_URL: http://admin-dashboard:3021
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN}
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ../eseltokens/eseltokens.db:/app/eseltokens.db
      - ../eseltokens/eseltokens.db-wal:/app/eseltokens.db-wal
      - ../eseltokens/eseltokens.db-shm:/app/eseltokens.db-shm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/eseltokens/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marvin_internal


  dashboard-php:
    build:
      context: .
      dockerfile: Dockerfile.dashboard-php
    container_name: dashboard-php-phase1
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    depends_on:
      fahrstuhl-docker:
        condition: service_healthy
    environment:
      FAHRSTUHL_API_BASE: ${FAHRSTUHL_API_BASE:-http://fahrstuhl-docker:3002}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://eselbande.com/fahrstuhl/callback.php}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-/fahrstuhl}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      OWNER_ID: ${OWNER_ID}
    ports:
      - "127.0.0.1:3181:8081"
    volumes:
      - ./dashboard/public/uploads:/app/dashboard/public/uploads
      - ./dashboard/data:/app/dashboard/data
    networks:
      - marvin_internal

  shop:
    build:
      context: ../shop
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
        NEXT_PUBLIC_PADDLE_ENVIRONMENT: ${NEXT_PUBLIC_PADDLE_ENVIRONMENT:-sandbox}
        NEXT_PUBLIC_PADDLE_PRICE_FAHRSTUHL_BASIC: ${NEXT_PUBLIC_PADDLE_PRICE_FAHRSTUHL_BASIC}
        NEXT_PUBLIC_PADDLE_PRICE_FAHRSTUHL_PRO: ${NEXT_PUBLIC_PADDLE_PRICE_FAHRSTUHL_PRO}
        NEXT_PUBLIC_PADDLE_PRICE_ESELBUILDER: ${NEXT_PUBLIC_PADDLE_PRICE_ESELBUILDER}
        NEXT_PUBLIC_PADDLE_PRICE_ESELMODERATOR_BASIC: ${NEXT_PUBLIC_PADDLE_PRICE_ESELMODERATOR_BASIC}
        NEXT_PUBLIC_PADDLE_PRICE_ESELMODERATOR_PRO: ${NEXT_PUBLIC_PADDLE_PRICE_ESELMODERATOR_PRO}
    container_name: shop-phase1
    restart: unless-stopped
    depends_on:
      fahrstuhl-docker:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 160m
    env_file:
      - path: ../shop/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=256"
      FAHRSTUHL_API_BASE: http://fahrstuhl-docker:3002
    ports:
      - "127.0.0.1:3117:3000"
    volumes:
      - ../shop/shop.db:/app/shop.db
      - ../shop/shop.db-wal:/app/shop.db-wal
      - ../shop/shop.db-shm:/app/shop.db-shm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - marvin_internal

  eselmoderator:
    build:
      context: ../eselmoderator
      dockerfile: Dockerfile
    container_name: eselmoderator-phase1
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    env_file:
      - path: ../eselmoderator/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3003
      MYSQL_HOST: host.docker.internal
      NODE_OPTIONS: "--max-old-space-size=192"
    ports:
      - "127.0.0.1:3118:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../eselmoderator/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - marvin_internal

volumes:
  admin_dashboard_data:
  redis_data:
  statuspage_data:
  linkshortener_data:
  filehoster_data:
  filehoster_uploads:
  zitatboard_data:
  umami_db_data:

networks:
  marvin_internal:
    name: marvin_internal
    driver: bridge